<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ==========================================================================
   AlgoViz — scoped design system (borntoDev main-campaign identity)
   Every selector lives under .btd-algoviz so nothing leaks into the WP theme.
   ========================================================================== */
.btd-algoviz{
  --brand:#FFC000; --brand-2:#FFE08A; --on-brand:#0A0A0A;
  --bg:#0A0A0A; --bg-1:#111; --bg-2:#181818; --bg-3:#222;
  --text:#fff; --text-2:rgba(255,255,255,.72); --text-3:rgba(255,255,255,.5);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.18);
  --card:#141414; --card-2:#1B1B1B;
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --maxw:1240px; --pad:32px;
  --shadow-1:0 8px 24px rgba(0,0,0,.45);
  --shadow-2:0 24px 56px rgba(0,0,0,.55);
  --accent:#FFC000;              /* overridden per category via .cat-* */
  --accent-ink:#0A0A0A;
  --code-bg:#0E0E0E;

  background:var(--bg); color:var(--text);
  font-family:'Noto Sans Thai',-apple-system,system-ui,sans-serif;
  font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  position:relative; overflow:hidden;
}
.btd-algoviz *{box-sizing:border-box}
.btd-algoviz img,.btd-algoviz svg{display:block; max-width:100%}
.btd-algoviz a{color:inherit; text-decoration:none}
.btd-algoviz button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit}
.btd-algoviz ::selection{background:var(--brand); color:var(--on-brand)}
.btd-algoviz h1,.btd-algoviz h2,.btd-algoviz h3,.btd-algoviz h4{margin:0; font-weight:800; letter-spacing:-.02em; line-height:1.1; color:var(--text)}
.btd-algoviz p{margin:0}

/* category accent tokens */
.btd-algoviz .cat-sort  {--accent:#FFC000; --accent-ink:#0A0A0A}
.btd-algoviz .cat-search{--accent:#0A84FF; --accent-ink:#fff}
.btd-algoviz .cat-linear{--accent:#30D158; --accent-ink:#07230f}
.btd-algoviz .cat-tree  {--accent:#A86BFF; --accent-ink:#fff}
.btd-algoviz .cat-graph {--accent:#D97757; --accent-ink:#fff}
.btd-algoviz .cat-recur {--accent:#FF5C8A; --accent-ink:#fff}
.btd-algoviz .cat-net   {--accent:#38BDF8; --accent-ink:#04121f}
/* domain colour hint on the band */
.btd-algoviz .cat-cs .av-domain-tag {background:#FFC000; color:#0A0A0A}
.btd-algoviz .cat-cpe .av-domain-tag{background:#38BDF8; color:#04121f}
.btd-algoviz .cat-se .av-domain-tag {background:#FF5C8A; color:#fff}

/* ---------------- layout ---------------- */
.btd-algoviz .av-wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--pad); width:100%}
.btd-algoviz .eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:var(--accent); font-family:'JetBrains Mono',monospace;
}
.btd-algoviz .eyebrow::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent)}
.btd-algoviz .lede{font-size:clamp(15px,1.2vw,18px); color:var(--text-2); max-width:62ch}

/* ---------------- buttons ---------------- */
.btd-algoviz .btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 20px; border-radius:999px; font-weight:700; font-size:14.5px; line-height:1;
  border:1px solid transparent; white-space:nowrap;
  transition:transform .15s, background .2s, border-color .2s, color .2s;
}
.btd-algoviz .btn:hover{transform:translateY(-1px)}
.btd-algoviz .btn-primary{background:var(--brand); color:var(--on-brand)}
.btd-algoviz .btn-primary:hover{background:var(--brand-2)}
.btd-algoviz .btn-accent{background:var(--accent); color:var(--accent-ink)}
.btd-algoviz .btn-ghost{background:transparent; color:var(--text); border-color:var(--line-2)}
.btd-algoviz .btn-ghost:hover{background:rgba(255,255,255,.05); border-color:var(--text-3)}
.btd-algoviz .btn-sm{padding:9px 15px; font-size:13px}
.btd-algoviz .btn[disabled]{opacity:.4; pointer-events:none}

/* ---------------- top bar ---------------- */
.btd-algoviz .av-top{
  position:sticky; top:0; z-index:40;
  background:rgba(10,10,10,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.btd-algoviz .av-top-row{display:flex; align-items:center; justify-content:space-between; gap:20px; padding:15px 0}
.btd-algoviz .av-brand{display:inline-flex; align-items:center; gap:11px; font-weight:800; font-size:17px; letter-spacing:-.01em}
.btd-algoviz .av-brand-mark{
  width:32px; height:32px; border-radius:8px; background:var(--brand); color:var(--on-brand);
  display:grid; place-items:center; font-weight:900; font-size:17px;
}
.btd-algoviz .av-brand small{color:var(--text-3); font-weight:500; font-size:13px}
.btd-algoviz .av-top-links{display:flex; gap:6px; align-items:center}
.btd-algoviz .av-top-links a{padding:8px 13px; border-radius:999px; color:var(--text-2); font-size:13.5px; font-weight:500; transition:.15s}
.btd-algoviz .av-top-links a:hover{color:var(--text); background:rgba(255,255,255,.05)}

/* ==========================================================================
   CATALOG VIEW
   ========================================================================== */
.btd-algoviz .av-view{display:none}
.btd-algoviz .av-view.is-active{display:block}

.btd-algoviz .av-hero{position:relative; padding:74px 0 46px; overflow:hidden; isolation:isolate}
.btd-algoviz .av-hero-bg{position:absolute; inset:0; z-index:-2; pointer-events:none}
.btd-algoviz .av-hero-canvas{position:absolute; inset:0; z-index:-1; pointer-events:none; opacity:.9}
.btd-algoviz .orb{position:absolute; border-radius:50%; filter:blur(140px); mix-blend-mode:screen}
.btd-algoviz .orb-a{width:640px; height:640px; background:#FFC000; top:-240px; right:-120px; opacity:.28}
.btd-algoviz .orb-b{width:560px; height:560px; background:#A86BFF; bottom:-260px; left:-160px; opacity:.22}
.btd-algoviz .orb-c{width:520px; height:520px; background:#0A84FF; top:24%; right:34%; opacity:.14}
.btd-algoviz .av-hero-grid-bg{
  position:absolute; inset:0; z-index:-2;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(ellipse 75% 65% at 60% 35%,#000,transparent 78%);
  mask-image:radial-gradient(ellipse 75% 65% at 60% 35%,#000,transparent 78%);
}
.btd-algoviz .av-hero-inner{max-width:820px}
.btd-algoviz .av-hero h1{font-size:clamp(38px,6vw,72px); font-weight:800; letter-spacing:-.035em; margin:20px 0 20px; line-height:1.02}
.btd-algoviz .av-hero h1 .accent{color:var(--brand)}
.btd-algoviz .av-hero .lede{font-size:clamp(16px,1.3vw,19px); margin-bottom:28px}
.btd-algoviz .av-hero-cta{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:34px}
.btd-algoviz .av-hero-stats{display:flex; flex-wrap:wrap; gap:12px 34px; padding-top:26px; border-top:1px solid var(--line)}
.btd-algoviz .av-hero-stat b{font-family:'JetBrains Mono',monospace; font-size:30px; font-weight:700; color:var(--brand); letter-spacing:-.02em}
.btd-algoviz .av-hero-stat span{display:block; font-size:12.5px; color:var(--text-3); margin-top:2px}

/* filter bar */
.btd-algoviz .av-filter{
  position:sticky; top:62px; z-index:30; margin:0 0 8px;
  background:rgba(10,10,10,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
}
.btd-algoviz .av-filter-row{display:flex; align-items:center; gap:14px; padding:14px 0; flex-wrap:wrap}
.btd-algoviz .av-search{
  flex:1; min-width:220px; display:flex; align-items:center; gap:9px;
  background:var(--bg-2); border:1px solid var(--line-2); border-radius:999px; padding:10px 16px;
}
.btd-algoviz .av-search svg{width:16px; height:16px; opacity:.55; flex:none}
.btd-algoviz .av-search input{flex:1; background:none; border:0; outline:none; color:var(--text); font-size:14.5px; font-family:inherit}
.btd-algoviz .av-search input::placeholder{color:var(--text-3)}
.btd-algoviz .av-chips{display:flex; gap:8px; flex-wrap:wrap}
.btd-algoviz .av-chip{
  padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;
  background:var(--bg-2); border:1px solid var(--line); color:var(--text-2); transition:.15s;
}
.btd-algoviz .av-chip:hover{border-color:var(--line-2); color:var(--text)}
.btd-algoviz .av-chip.is-active{background:var(--text); color:var(--on-brand); border-color:var(--text)}

/* domain bands */
.btd-algoviz .av-domain{padding:14px 0 4px}
.btd-algoviz .av-domain + .av-domain{margin-top:10px}
.btd-algoviz .av-domain-head{display:flex; align-items:center; gap:16px; margin:22px 0 4px; padding-bottom:16px; border-bottom:1px solid var(--line-2)}
.btd-algoviz .av-domain-tag{flex:none; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:7px 12px; border-radius:8px}
.btd-algoviz .av-domain-title{font-size:clamp(24px,3vw,36px); font-weight:800; letter-spacing:-.02em; line-height:1.05}
.btd-algoviz .av-domain-note{font-size:13px; color:var(--text-3); margin-top:4px}

/* category sections */
.btd-algoviz .av-cat{padding:32px 0 8px}
.btd-algoviz .av-cat-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap}
.btd-algoviz .av-cat-head h2{font-size:clamp(22px,2.4vw,30px); margin-top:8px}
.btd-algoviz .av-cat-head .av-cat-count{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--text-3)}
.btd-algoviz .av-cat-bar{width:36px; height:4px; border-radius:999px; background:var(--accent); margin-bottom:6px}

.btd-algoviz .av-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px}

/* algorithm card */
.btd-algoviz .av-card{
  position:relative; display:flex; flex-direction:column; overflow:hidden;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  cursor:pointer; transition:transform .2s, border-color .2s, box-shadow .2s;
}
.btd-algoviz .av-card:hover{transform:translateY(-5px); border-color:color-mix(in srgb,var(--accent) 55%,transparent); box-shadow:0 24px 48px -26px rgba(0,0,0,.8)}
.btd-algoviz .av-card:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btd-algoviz .av-card-glow{position:absolute; inset:0; z-index:0; pointer-events:none; opacity:0; transition:opacity .25s;
  background:radial-gradient(320px 140px at 80% -20%, color-mix(in srgb,var(--accent) 28%,transparent), transparent 70%)}
.btd-algoviz .av-card:hover .av-card-glow{opacity:1}
.btd-algoviz .av-card-visual{position:relative; z-index:1; height:96px; display:grid; place-items:center;
  border-bottom:1px solid var(--line); background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.btd-algoviz .av-card-glyph{width:54px; height:54px; color:var(--accent); filter:drop-shadow(0 0 12px color-mix(in srgb,var(--accent) 45%,transparent))}
.btd-algoviz .av-card-body{position:relative; z-index:1; padding:16px 18px 18px; display:flex; flex-direction:column; gap:7px; flex:1}
.btd-algoviz .av-card-en{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em; color:var(--accent); text-transform:uppercase}
.btd-algoviz .av-card h3{font-size:17px; font-weight:700; letter-spacing:-.01em; line-height:1.2}
.btd-algoviz .av-card-meta{display:flex; align-items:center; gap:10px; margin-top:auto; padding-top:10px}
.btd-algoviz .av-stars{color:var(--accent); font-size:12px; letter-spacing:1px}
.btd-algoviz .av-cx{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-3); background:var(--bg-2); border:1px solid var(--line); border-radius:6px; padding:3px 7px; margin-left:auto}
.btd-algoviz .av-empty{padding:60px 0; text-align:center; color:var(--text-3); font-size:15px}

/* ==========================================================================
   VISUALIZER VIEW
   ========================================================================== */
.btd-algoviz .av-vizbar{border-bottom:1px solid var(--line); background:var(--bg-1)}
.btd-algoviz .av-vizbar-row{display:flex; align-items:center; gap:14px; padding:14px 0; flex-wrap:wrap}
.btd-algoviz .av-back{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; color:var(--text-2); padding:8px 14px; border-radius:999px; border:1px solid var(--line-2); transition:.15s}
.btd-algoviz .av-back:hover{color:var(--text); background:rgba(255,255,255,.05)}
.btd-algoviz .av-viz-title{display:flex; flex-direction:column; gap:1px; min-width:0}
.btd-algoviz .av-viz-title .cat-label{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
.btd-algoviz .av-viz-title h1{font-size:20px; font-weight:800; letter-spacing:-.01em}
.btd-algoviz .av-viz-nav{display:flex; gap:8px; margin-left:auto}
.btd-algoviz .av-navbtn{width:40px; height:40px; border-radius:999px; border:1px solid var(--line-2); display:grid; place-items:center; color:var(--text); transition:.15s}
.btd-algoviz .av-navbtn:hover{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btd-algoviz .av-navbtn svg{width:18px; height:18px}

.btd-algoviz .av-viz{display:grid; grid-template-columns:280px minmax(0,1fr) 320px; gap:20px; padding:24px 0 60px; align-items:start}
.btd-algoviz .av-panel{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px}
.btd-algoviz .av-panel h4{font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); margin-bottom:14px; font-family:'JetBrains Mono',monospace}
.btd-algoviz .av-panel + .av-panel{margin-top:16px}

/* controls */
.btd-algoviz .av-field{margin-bottom:16px}
.btd-algoviz .av-field label{display:block; font-size:12.5px; color:var(--text-2); margin-bottom:6px; font-weight:600}
.btd-algoviz .av-input{width:100%; background:var(--bg-2); border:1px solid var(--line-2); border-radius:var(--r-sm); padding:10px 12px; color:var(--text); font-size:14px; font-family:'JetBrains Mono',monospace; outline:none}
.btd-algoviz .av-input:focus{border-color:var(--accent)}
.btd-algoviz .av-btn-row{display:flex; gap:8px; flex-wrap:wrap}
.btd-algoviz .av-btn-row .btn{flex:1}
.btd-algoviz input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:999px; background:var(--bg-3); outline:none; margin:8px 0}
.btd-algoviz input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer; border:2px solid var(--bg)}
.btd-algoviz input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer; border:2px solid var(--bg)}
.btd-algoviz .av-range-val{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-3); float:right}

/* transport / player controls */
.btd-algoviz .av-transport{display:flex; align-items:center; gap:8px; margin-bottom:12px}
.btd-algoviz .av-tbtn{width:42px; height:42px; border-radius:12px; background:var(--bg-2); border:1px solid var(--line-2); display:grid; place-items:center; color:var(--text); transition:.15s}
.btd-algoviz .av-tbtn:hover{border-color:var(--accent); color:var(--accent)}
.btd-algoviz .av-tbtn svg{width:18px; height:18px}
.btd-algoviz .av-tbtn.play{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); width:52px; height:52px}
.btd-algoviz .av-tbtn.play:hover{filter:brightness(1.08); color:var(--accent-ink)}
.btd-algoviz .av-scrub{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.btd-algoviz .av-scrub .cur{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-3); white-space:nowrap; min-width:66px; text-align:right}

/* stage */
.btd-algoviz .av-stage-wrap{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.btd-algoviz .av-caption{display:flex; align-items:center; gap:10px; padding:15px 20px; border-bottom:1px solid var(--line); min-height:56px}
.btd-algoviz .av-caption .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; box-shadow:0 0 10px var(--accent)}
.btd-algoviz .av-caption span{font-size:14.5px; color:var(--text); font-weight:500}
.btd-algoviz .av-stage{position:relative; width:100%; aspect-ratio:16/9; background:
  radial-gradient(circle at 50% 0%, rgba(255,255,255,.03), transparent 60%), var(--code-bg)}
.btd-algoviz .av-stage svg{position:absolute; inset:0; width:100%; height:100%}
.btd-algoviz .av-stats{display:flex; gap:10px; padding:14px 20px; border-top:1px solid var(--line); flex-wrap:wrap}
.btd-algoviz .av-stat{display:flex; flex-direction:column; gap:1px; background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:8px 14px; min-width:78px}
.btd-algoviz .av-stat b{font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--text)}
.btd-algoviz .av-stat span{font-size:11px; color:var(--text-3)}

/* explain panel */
.btd-algoviz .av-cx-row{display:flex; gap:10px; margin-bottom:16px}
.btd-algoviz .av-cx-box{flex:1; background:var(--bg-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.btd-algoviz .av-cx-box .k{font-size:11px; color:var(--text-3); margin-bottom:3px}
.btd-algoviz .av-cx-box .v{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; color:var(--accent)}
.btd-algoviz .av-pseudo{background:var(--code-bg); border:1px solid var(--line); border-radius:12px; padding:12px; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.7; overflow-x:auto}
.btd-algoviz .av-pseudo .ln{display:flex; gap:12px; padding:1px 8px; border-radius:5px; white-space:pre; color:var(--text-2); transition:background .15s,color .15s}
.btd-algoviz .av-pseudo .ln .no{color:var(--text-3); opacity:.5; -webkit-user-select:none; user-select:none; text-align:right; min-width:18px}
.btd-algoviz .av-pseudo .ln.on{background:color-mix(in srgb,var(--accent) 20%,transparent); color:#fff}
.btd-algoviz .av-pseudo .ln.on .no{color:var(--accent); opacity:1}
.btd-algoviz .av-explain{font-size:14px; color:var(--text-2); line-height:1.65; margin-top:14px}
.btd-algoviz .av-note{margin-top:14px; padding:13px 15px; background:color-mix(in srgb,var(--accent) 8%,transparent); border:1px solid color-mix(in srgb,var(--accent) 30%,transparent); border-radius:12px; font-size:13px; color:var(--text-2)}
.btd-algoviz .av-note b{color:var(--text)}

/* ---------------- SVG element classes (renderers) ---------------- */
.btd-algoviz .n-bar{fill:#3a3a3a; transition:fill .2s}
.btd-algoviz .n-bar.compare{fill:var(--brand)}
.btd-algoviz .n-bar.swap{fill:#FF5C8A}
.btd-algoviz .n-bar.pivot{fill:#A86BFF}
.btd-algoviz .n-bar.sorted{fill:#30D158}
.btd-algoviz .n-bar.active{fill:#0A84FF}
.btd-algoviz .n-bar.dim{fill:#242424}
