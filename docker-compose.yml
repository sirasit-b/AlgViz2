services:
  # เว็บ: PHP 8.3 + Apache → http://localhost:8088
  web:
    build: .
    ports:
      - "8088:80"
    volumes:
      # bind mount ทั้งโฟลเดอร์ → แก้ไฟล์แล้ว refresh เห็นผลทันที ไม่ต้อง rebuild image
      - .:/var/www/html
    restart: unless-stopped

  # build assets จาก src/ (รันครั้งเดียวตามต้องการ):
  #   docker compose run --rm build
  build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: node build/build.mjs
    profiles: ["tools"]
